version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Монтируем локальную папку с весами в папку внутри контейнера
      # Формат: <путь_на_хосте>:<путь_в_контейнере>
      - ./backend/models:/app/models
    # Если нужно, можно явно передать путь к файлу через переменную окружения
    environment:
      - MODEL_PATH=/app/models/model.pth
    restart: unless-stopped
